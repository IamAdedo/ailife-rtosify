name: Build Android APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Phone App ───────────────────────────────────────────────────────────────
  build-phone:
    name: Build Phone App (rtosify)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            rtosify/gradle/wrapper/gradle-wrapper.properties
            rtosify/gradle/libs.versions.toml

      - name: Grant execute permission for gradlew
        working-directory: rtosify
        run: chmod +x gradlew

      - name: Run unit tests
        working-directory: rtosify
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: rtosify
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Release: inject debug keystore via local.properties so AGP 8+ is satisfied
      # For production, replace with encrypted GitHub secrets + a real keystore
      - name: Create signing properties for release
        run: |
          echo "KEYSTORE_PATH=$HOME/.android/debug.keystore" >> rtosify/local.properties
          echo "KEY_ALIAS=androiddebugkey"                   >> rtosify/local.properties
          echo "KEY_PASSWORD=android"                        >> rtosify/local.properties
          echo "STORE_PASSWORD=android"                      >> rtosify/local.properties

      - name: Add signingConfig to release build
        working-directory: rtosify
        run: |
          # Patch signingConfigs into the app build file for CI only
          # (avoids requiring secrets setup for contributors)
          cat >> app/build.gradle.kts << 'EOF'

          // CI-injected signing — uses debug keystore for release builds in CI
          android.signingConfigs.create("ciRelease") {
              storeFile = file(System.getenv("HOME") + "/.android/debug.keystore")
              storePassword = "android"
              keyAlias = "androiddebugkey"
              keyPassword = "android"
          }
          android.buildTypes.getByName("release").signingConfig =
              android.signingConfigs.getByName("ciRelease")
          EOF

      - name: Build Release APK
        working-directory: rtosify
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-app-debug
          path: rtosify/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-app-release
          path: rtosify/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  # ── Watch Companion App ─────────────────────────────────────────────────────
  build-watch:
    name: Build Watch App (companion)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            companion/gradle/wrapper/gradle-wrapper.properties
            companion/gradle/libs.versions.toml

      - name: Grant execute permission for gradlew
        working-directory: companion
        run: chmod +x gradlew

      - name: Run unit tests
        working-directory: companion
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: companion
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Add signingConfig to release build
        working-directory: companion
        run: |
          cat >> app/build.gradle.kts << 'EOF'

          android.signingConfigs.create("ciRelease") {
              storeFile = file(System.getenv("HOME") + "/.android/debug.keystore")
              storePassword = "android"
              keyAlias = "androiddebugkey"
              keyPassword = "android"
          }
          android.buildTypes.getByName("release").signingConfig =
              android.signingConfigs.getByName("ciRelease")
          EOF

      - name: Build Release APK
        working-directory: companion
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-app-debug
          path: companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-app-release
          path: companion/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  # ── Summary gate ─────────────────────────────────────────────────────────────
  build-summary:
    name: All builds passed
    runs-on: ubuntu-latest
    needs: [ build-phone, build-watch ]
    permissions:
      contents: read
    steps:
      - name: Done
        run: echo "Both phone and watch APKs built successfully."
